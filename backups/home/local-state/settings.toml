config_version = 14

[bar.default]
center = [ "nixos_menu", "workspaces", "group:tools", "clock", "audio_visualizer", "group:status" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "primary"
    enabled = true
    fill = "surface_variant"
    foreground = "primary"
    id = "tools"
    members = [ "launcher", "settings", "wallhaven", "screenshot", "caffeine", "nightlight" ]
    opacity = 0.15000000596046448
    padding = 6.0
    widget_spacing = 4

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "primary"
    enabled = true
    fill = "surface_variant"
    foreground = "primary"
    id = "status"
    members = [
        "tray",
        "notifications",
        "network",
        "dns-switcher",
        "bluetooth",
        "volume",
        "power_profile",
        "control-center",
        "session"
    ]
    opacity = 0.0
    padding = 6.0
    widget_spacing = 4

[dock]
pinned = [
    "nixos",
    "helium",
    "org.kde.dolphin",
    "basecamp",
    "lightworks",
    "com.obsproject.Studio",
    "steam",
    "limusic",
    "kitty"
]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-3"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "nightwatch75/dns-switcher", "noctalia/wallhaven" ]

[shell]
polkit_agent = true

[wallpaper.default]
path = "/home/kenny/Pictures/wallhaven-pog55m.jpg"

[wallpaper.last]
path = "/home/kenny/Pictures/wallhaven-pog55m.jpg"

[wallpaper.monitors.DP-2]
path = "/home/kenny/Pictures/wallhaven-pog55m.jpg"

[wallpaper.monitors.DP-3]
path = "/home/kenny/Pictures/wallhaven-pog55m.jpg"

[widget.audio_visualizer]
color = "primary"
color_2 = "tertiary"
font_family = "JetBrainsMono Nerd Font"
icon_color = "primary"
show_when_idle = true

[widget.clock]
color = "primary"

[widget.dns-switcher]
show_label = false
type = "nightwatch75/dns-switcher:dns-switcher"

[widget.nixos_menu]
capsule = true
color = "primary"
icon_color = "primary"

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.workspaces]
empty_color = "primary"
occupied_color = "primary"